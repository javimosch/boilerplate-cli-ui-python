name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Linux (amd64)
        run: |
          chmod +x build.sh
          ./build.sh
          mv boilerplate-cli-ui-python boilerplate-cli-ui-python-linux-amd64

      - name: Create checksums
        run: sha256sum boilerplate-cli-ui-linux-amd64 > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "boilerplate-cli-ui-linux-amd64 checksums.txt"
          draft: false
          prerelease: false