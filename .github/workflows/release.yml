name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body: |
            ## Boilerplate CLI UI Python v${{ github.ref_name }}
            
            Agent-first Python CLI boilerplate with HTTP API and daemon support.
            
            ### Installation
            
            ```bash
            # Clone repository
            git clone https://github.com/javimosch/boilerplate-cli-ui-python.git
            cd boilerplate-cli-ui-python
            
            # Create virtual environment
            python -m venv venv
            source venv/bin/activate
            
            # Run CLI
            python -m src.main greet --name Alice
            ```
            
            ### Features
            
            - JSON-by-default output with --human opt-in
            - Semantic exit codes (80-119)
            - Structured error handling
            - HTTP server with JSON API
            - Daemon process management
            - Docker support
            - Agent-friendly documentation
            
            ### Documentation
            
            - [AGENTS.md](AGENTS.md) - Development guide for AI agents
            - [.agents/skills/](.agents/skills/) - Usage and development guides
            - [README.md](README.md) - User documentation