name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./boilerplate-cli-ui-python version

      - name: Report binary size
        run: |
          set -e
          BIN=$(echo "./boilerplate-cli-ui-python version" | awk '{print $1}')
          echo "binary=$BIN size=$(stat -c%s "$BIN") bytes"
