<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boilerplate CLI UI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- React Router -->
    <script src="https://unpkg.com/history@5/umd/history.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
        
        :root {
            --canvas: #F7F6F3;
            --surface: #FFFFFF;
            --border: #EAEAEA;
            --text-primary: #111111;
            --text-secondary: #787774;
            --accent-red: #FDEBEC;
            --accent-red-text: #9F2F2D;
            --accent-blue: #E1F3FE;
            --accent-blue-text: #1F6C9F;
            --accent-green: #EDF3EC;
            --accent-green-text: #346538;
        }
        
        body {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--canvas);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .mono {
            font-family: 'Geist Mono', monospace;
        }
        
        .scroll-entry {
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(12px);
        }
        
        @keyframes fadeSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card-hover {
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        
        .card-hover:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transform: translateY(-1px);
        }
        
        .btn-active {
            transform: scale(0.98);
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--canvas);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Main App -->
    <script type="text/babel" src="js/app.js"></script>
    
    <!-- Services -->
    <script type="text/babel" src="js/services/apiService.js"></script>
    
    <!-- Composables -->
    <script type="text/babel" src="js/composables/useDaemonStatus.js"></script>
    
    <!-- Components -->
    <script type="text/babel" src="js/components/Sidebar.js"></script>
    <script type="text/babel" src="js/components/StatusCard.js"></script>
    <script type="text/babel" src="js/components/ResponseViewer.js"></script>
    <script type="text/babel" src="js/components/APITester.js"></script>
    <script type="text/babel" src="js/components/MobileHeader.js"></script>
    
    <!-- Views -->
    <script type="text/babel" src="js/views/Dashboard.js"></script>
    <script type="text/babel" src="js/views/APITestView.js"></script>
    <script type="text/babel" src="js/views/SettingsView.js"></script>
</body>
</html>
