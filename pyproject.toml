[project]
name = "boilerplate-cli-ui-python"
version = "1.0.0"
description = "Agent-first Python CLI boilerplate with HTTP API and daemon support"
authors = [
    {name = "Javier Leandro Arancibia"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["cli", "agent-first", "boilerplate", "http-api", "daemon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/javimosch/supercli-cli-boilerplates"
Repository = "https://github.com/javimosch/supercli-cli-boilerplates"
Documentation = "https://github.com/javimosch/supercli-cli-boilerplates/tree/main/boilerplate-cli-ui-python"

[project.scripts]
boilerplate-cli-ui-python = "src.main:main"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true